name: Upload Poster Images to IONOS

on:
  workflow_dispatch:  # Manuell starten per Klick auf GitHub

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 Stunden max (reicht für 8.000 Bilder)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload all Box folders to IONOS
        env:
          SFTP_HOST: access-5020418604.webspace-host.com
          SFTP_USER: su844643
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: 22
        run: |
          echo "Starting upload of all Box folders..."

          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open sftp://$SFTP_USER:$SFTP_PASS@$SFTP_HOST:$SFTP_PORT;
            mirror --reverse --verbose --parallel=4 \
              --include-glob 'Box*/' \
              --exclude '.git/' \
              --exclude '.github/' \
              . /public/wp-content/uploads/posters/;
            bye
          "

          echo "✅ Upload complete!"

      - name: Summary
        run: |
          echo "All poster images uploaded to:"
          echo "  /public/wp-content/uploads/posters/"
          echo ""
          echo "Image base URL:"
          echo "  https://crazy-posterdeals.com/wp-content/uploads/posters/Box%20n1/Filmtitel.JPG"
